<!DOCTYPE html>
<html>
<head>
    <title>College Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" id="auth">
        <h1>KL College</h1>
        <img src="logo.jpeg" height="100" width="100" >
        <p></p>

        <div class="tabs">
            <button onclick="showLogin()">Login</button>
            <button onclick="showSignup()">Signup</button>
        </div>

        <form id="loginForm">
            <h2>Student Login</h2>
            <input type="email" id="loginEmail"
                   placeholder="Email address" required>
            <input type="password" id="loginPassword"
                   placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <form id="signupForm" class="hidden">
            <h2>Create Account</h2>
            <input type="text" id="signupName"
                   placeholder="Full Name" required>
            <input type="email" id="signupEmail"
                   placeholder="Email address" required>
            <input type="password" id="signupPassword"
                   placeholder="Create Password" required>
            <button type="submit">Signup</button>
        </form>

        <p id="message"></p>
    </div>
    <div id="dashboard" class="hidden">
        <header>
            <h1>KL College </h1>
            <button onclick="logout()">Logout</button>
        </header>

        <div class="welcome">
            <h2>Welcome<span id="studentName"></span>!</h2>
            <p>Explore our college departments</p>
        </div>

        <h2 class="heading">Our Departments</h2>

        <div class="departments">
            <div class="card" onclick="showDepartment('CSE')">
                <h3>Computer Science</h3>
                <p>CSE</p>
            </div>

            <div class="card" onclick="showDepartment('ECE')">
                <h3>Electronics</h3>
                <p>ECE</p>
            </div>

            <div class="card" onclick="showDepartment('EEE')">
                <h3>Electrical</h3>
                <p>EEE</p>
            </div>
        </div>
        <div class="card" onclick="showDepartment('IT')">
                <h3>Information Technology</h3>
                <p>IT</p>
            </div>
        </div>
         <div class="card" onclick="showDepartment('CIVIL')">
                <h3>Civil Engineering</h3>
                <p>CIVIL</p>
            </div>

        <div id="departmentDetails" class="details hidden">
            <h2 id="deptTitle"></h2>
            <p id="deptDescription"></p>
            <button onclick="closeDepartment()">Close</button>
        </div>
    </div>
    


    <script src="script.js"></script>
</body>
</html>
